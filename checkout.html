<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | DESI TREND</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html">DESI <span>TREND</span></a><nav><a href="cart.html">Back to cart</a></nav></header><main class="section narrow"><h1>Checkout</h1><form id="checkoutForm" class="form-card"><label>Full name<input name="name" required></label><label>Mobile number<input name="phone" inputmode="numeric" pattern="[0-9]{10}" required placeholder="10-digit mobile number"></label><label>Full delivery address<textarea name="address" required rows="4"></textarea></label><label>PIN code<input name="pincode" inputmode="numeric" pattern="[0-9]{6}" required></label><label>Payment method<select name="payment"><option value="COD">Cash on Delivery (COD)</option><option value="Online (not configured)">Online payment (setup required)</option></select></label><button class="btn" type="submit">Place order</button><p class="muted">Demo checkout: orders are saved in this browser only. Connect a backend before accepting real orders.</p></form></main><footer>© DESI TREND</footer><script src="js/app.js"></script></body></html>
