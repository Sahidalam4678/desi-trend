<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Reports | DESI TREND</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .back {
            text-decoration: none;
            color: #232f3e;
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            font-size: 16px;
        }

        .card h1 {
            color: #232f3e;
            font-size: 28px;
        }

        .sales {
            border-left: 5px solid #28a745;
        }

        .orders {
            border-left: 5px solid #007bff;
        }

        .pending {
            border-left: 5px solid #ffc107;
        }

        .cancelled {
            border-left: 5px solid #dc3545;
        }

        .section {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
        }

        .progress {
            background: #eee;
            height: 15px;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0 20px;
        }

        .progress-bar {
            height: 100%;
            background: #28a745;
            width: 0%;
        }

        button {
            padding: 12px 20px;
            background: #ff9900;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>DESI TREND</h1>

        <a href="dashboard.html" class="back">
            ← Dashboard
        </a>

    </div>

    <h2>Business Reports</h2>

    <p>Track your online business performance.</p>

    <div class="report-grid">

        <div class="card sales">
            <h3>Total Sales</h3>
            <h1 id="totalSales">₹0</h1>
        </div>

        <div class="card orders">
            <h3>Total Orders</h3>
            <h1 id="totalOrders">0</h1>
        </div>

        <div class="card">
            <h3>Delivered Orders</h3>
            <h1 id="delivered">0</h1>
        </div>

        <div class="card pending">
            <h3>Pending Orders</h3>
            <h1 id="pending">0</h1>
        </div>

        <div class="card cancelled">
            <h3>Cancelled Orders</h3>
            <h1 id="cancelled">0</h1>
        </div>

    </div>

    <div class="section">

        <h2>Order Performance</h2>

        <p>Delivered Orders</p>

        <div class="progress">
            <div class="progress-bar" id="deliveryProgress"></div>
        </div>

        <p>Pending Orders</p>

        <div class="progress">
            <div class="progress-bar"
                 id="pendingProgress"
                 style="background:#ffc107">
            </div>
        </div>

        <p>Cancelled Orders</p>

        <div class="progress">
            <div class="progress-bar"
                 id="cancelProgress"
                 style="background:#dc3545">
            </div>
        </div>

        <button onclick="loadReports()">
            Refresh Reports
        </button>

    </div>

</div>

<script>

function loadReports() {

    const orders = JSON.parse(
        localStorage.getItem("orders")
    ) || [];

    const totalOrders = orders.length;

    const deliveredOrders = orders.filter(
        order => order.status === "Delivered"
    ).length;

    const pendingOrders = orders.filter(
        order => order.status === "Pending"
    ).length;

    const cancelledOrders = orders.filter(
        order => order.status === "Cancelled"
    ).length;

    // Calculate sales from delivered orders only

    const totalSales = orders.reduce((sum, order) => {

        if (order.status === "Delivered") {

            return sum + Number(order.total || 0);

        }

        return sum;

    }, 0);

    document.getElementById("totalSales").innerText =
        "₹" + totalSales.toLocaleString("en-IN");

    document.getElementById("totalOrders").innerText =
        totalOrders;

    document.getElementById("delivered").innerText =
        deliveredOrders;

    document.getElementById("pending").innerText =
        pendingOrders;

    document.getElementById("cancelled").innerText =
        cancelledOrders;

    function percentage(value) {

        return totalOrders === 0
            ? 0
            : (value / totalOrders) * 100;

    }

    document.getElementById("deliveryProgress")
    .style.width = percentage(deliveredOrders) + "%";

    document.getElementById("pendingProgress")
    .style.width = percentage(pendingOrders) + "%";

    document.getElementById("cancelProgress")
    .style.width = percentage(cancelledOrders) + "%";

}

loadReports();

</script>

</body>
</html>
