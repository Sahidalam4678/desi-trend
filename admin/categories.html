<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - DESI TREND</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #222;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: #087b48;
            margin: 3px;
        }

        .delete {
            background: #dc3545;
        }

        .edit {
            background: #007bff;
        }

        .category {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border: 1px solid #ddd;
        }

        .category strong {
            font-size: 16px;
        }

        .back {
            background: #333;
            text-decoration: none;
            color: white;
            padding: 10px 15px;
            display: inline-block;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>DESI TREND</h1>
    <h2>Product Category Management</h2>

    <a href="dashboard.html" class="back">← Back to Dashboard</a>

    <div class="card">
        <h3>Add New Category</h3>

        <input
            type="text"
            id="categoryName"
            placeholder="Enter Category Name"
        >

        <button onclick="saveCategory()">Add Category</button>
    </div>

    <div class="card">
        <h3>All Categories</h3>
        <div id="categoryList"></div>
    </div>

</div>

<script>
    let categories = JSON.parse(
        localStorage.getItem("categories") || "[]"
    );

    let editIndex = -1;

    function displayCategories() {
        const list = document.getElementById("categoryList");

        list.innerHTML = "";

        if (categories.length === 0) {
            list.innerHTML = "<p>No categories added yet.</p>";
            return;
        }

        categories.forEach((category, index) => {
            list.innerHTML += `
                <div class="category">
                    <strong>${escapeHTML(category)}</strong>

                    <div>
                        <button class="edit"
                            onclick="editCategory(${index})">
                            Edit
                        </button>

                        <button class="delete"
                            onclick="deleteCategory(${index})">
                            Delete
                        </button>
                    </div>
                </div>
            `;
        });
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }

    function saveCategory() {
        const input = document.getElementById("categoryName");
        const name = input.value.trim();

        if (!name) {
            alert("Please enter a category name.");
            return;
        }

        const duplicate = categories.some((category, index) =>
            category.toLowerCase() === name.toLowerCase()
            && index !== editIndex
        );

        if (duplicate) {
            alert("This category already exists.");
            return;
        }

        if (editIndex === -1) {
            categories.push(name);
            alert("Category added successfully!");
        } else {
            categories[editIndex] = name;
            editIndex = -1;
            alert("Category updated successfully!");
        }

        localStorage.setItem("categories", JSON.stringify(categories));

        input.value = "";
        displayCategories();
    }

    function editCategory(index) {
        document.getElementById("categoryName").value =
            categories[index];

        editIndex = index;
    }

    function deleteCategory(index) {
        if (confirm("Are you sure you want to delete this category?")) {
            categories.splice(index, 1);

            localStorage.setItem(
                "categories",
                JSON.stringify(categories)
            );

            displayCategories();
        }
    }

    displayCategories();
</script>

</body>
</html>
