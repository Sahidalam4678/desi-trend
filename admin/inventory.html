<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management | DESI TREND</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .back {
            text-decoration: none;
            color: #232f3e;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            border-left: 5px solid #ff9900;
        }

        .card h2 {
            color: #232f3e;
            font-size: 28px;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 25px;
            background: white;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #232f3e;
            color: white;
        }

        input {
            width: 85px;
            padding: 8px;
        }

        button {
            padding: 9px 13px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #ff9900;
        }

        .low {
            color: #e68a00;
            font-weight: bold;
        }

        .out {
            color: red;
            font-weight: bold;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>DESI TREND</h1>

        <a href="dashboard.html" class="back">
            ← Dashboard
        </a>

    </div>

    <h2>Inventory Management</h2>

    <p>Manage your product stock and availability.</p>

    <!-- Inventory Summary -->

    <div class="cards">

        <div class="card">
            <h3>Total Products</h3>
            <h2 id="totalProducts">0</h2>
        </div>

        <div class="card">
            <h3>Total Stock</h3>
            <h2 id="totalStock">0</h2>
        </div>

        <div class="card">
            <h3>Low Stock</h3>
            <h2 id="lowStock">0</h2>
        </div>

        <div class="card">
            <h3>Out of Stock</h3>
            <h2 id="outStock">0</h2>
        </div>

    </div>

    <!-- Product Inventory -->

    <h2>Product Stock List</h2>

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>
                    <th>SL No.</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Available Stock</th>
                    <th>Stock Status</th>
                    <th>Update Stock</th>
                </tr>

            </thead>

            <tbody id="inventoryList">

            </tbody>

        </table>

    </div>

</div>

<script>

function getProducts() {

    return JSON.parse(
        localStorage.getItem("products")
    ) || [];

}


// Load Inventory

function loadInventory() {

    const products = getProducts();

    const list = document.getElementById("inventoryList");

    list.innerHTML = "";

    let totalStock = 0;
    let lowStock = 0;
    let outStock = 0;

    products.forEach((product, index) => {

        const stock = Math.max(
            0,
            Number(product.stock || 0)
        );

        totalStock += stock;

        if (stock === 0) {
            outStock++;
        }
        else if (stock <= 5) {
            lowStock++;
        }

        let status = "Available";
        let statusClass = "available";

        if (stock === 0) {
            status = "Out of Stock";
            statusClass = "out";
        }
        else if (stock <= 5) {
            status = "Low Stock";
            statusClass = "low";
        }

        const row = document.createElement("tr");

        const values = [
            index + 1,
            product.name || "Product",
            "₹" + (product.price || 0)
        ];

        values.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            row.appendChild(td);
        });

        const stockCell = document.createElement("td");
        stockCell.textContent = stock;
        row.appendChild(stockCell);

        const statusCell = document.createElement("td");
        statusCell.textContent = status;
        statusCell.className = statusClass;
        row.appendChild(statusCell);

        const updateCell = document.createElement("td");

        const input = document.createElement("input");

        input.type = "number";
        input.min = "0";
        input.value = stock;
        input.id = "stock-" + index;

        const button = document.createElement("button");

        button.textContent = "Update";

        button.addEventListener("click", function() {
            updateStock(index);
        });

        updateCell.appendChild(input);
        updateCell.appendChild(button);

        row.appendChild(updateCell);

        list.appendChild(row);

    });

    if (products.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No Products Available.
                    Please Add Products First.
                </td>
            </tr>
        `;

    }

    document.getElementById("totalProducts").innerText =
        products.length;

    document.getElementById("totalStock").innerText =
        totalStock;

    document.getElementById("lowStock").innerText =
        lowStock;

    document.getElementById("outStock").innerText =
        outStock;

}


// Update Stock

function updateStock(index) {

    let products = getProducts();

    const input = document.getElementById("stock-" + index);

    const newStock = Number(input.value);

    if (
        input.value.trim() === "" ||
        !Number.isInteger(newStock) ||
        newStock < 0
    ) {

        alert("Please enter a valid stock quantity.");

        return;
    }

    products[index].stock = newStock;

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

    alert("Stock Updated Successfully!");

    loadInventory();

}

loadInventory();

</script>

</div>

</body>
</html>
