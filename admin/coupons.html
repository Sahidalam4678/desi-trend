<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coupon Management | DESI TREND</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .back {
            text-decoration: none;
            color: #232f3e;
        }

        .coupon-form,
        .coupon-section {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn {
            background: #ff9900;
            color: black;
            width: 100%;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            margin: 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #232f3e;
            color: white;
        }

        #message {
            color: green;
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>DESI TREND</h1>

        <a href="dashboard.html" class="back">
            ← Dashboard
        </a>

    </div>

    <h2>Coupon Management</h2>

    <p>Create and manage discount coupons.</p>

    <!-- Add Coupon -->

    <div class="coupon-form">

        <h2>Create New Coupon</h2>

        <form id="couponForm">

            <label>Coupon Code</label>

            <input
                type="text"
                id="code"
                placeholder="Example: DESI10"
                required
            >

            <label>Discount Type</label>

            <select id="type" required>

                <option value="percentage">
                    Percentage (%)
                </option>

                <option value="fixed">
                    Fixed Amount (₹)
                </option>

            </select>

            <label>Discount Value</label>

            <input
                type="number"
                id="discount"
                min="1"
                required
            >

            <label>Minimum Order Amount (₹)</label>

            <input
                type="number"
                id="minimum"
                min="0"
                value="0"
            >

            <button type="submit" class="add-btn">
                Create Coupon
            </button>

        </form>

        <p id="message"></p>

    </div>

    <!-- Coupon List -->

    <div class="coupon-section">

        <h2>Available Coupons</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>SL No.</th>
                        <th>Coupon Code</th>
                        <th>Discount</th>
                        <th>Minimum Order</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="couponList">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

function getCoupons() {

    return JSON.parse(
        localStorage.getItem("coupons")
    ) || [];

}


// Display Coupons

function loadCoupons() {

    const coupons = getCoupons();

    const list = document.getElementById("couponList");

    list.innerHTML = "";

    if (coupons.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="5">
                    No Coupons Available
                </td>
            </tr>
        `;

        return;
    }

    coupons.forEach((coupon, index) => {

        const discountText =
            coupon.type === "percentage"
            ? coupon.discount + "%"
            : "₹" + coupon.discount;

        list.innerHTML += `

            <tr>

                <td>${index + 1}</td>

                <td>${coupon.code}</td>

                <td>${discountText}</td>

                <td>₹${coupon.minimum}</td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteCoupon(${index})">
                        Delete
                    </button>
                </td>

            </tr>

        `;

    });

}


// Create Coupon

document.getElementById("couponForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const code = document.getElementById("code")
        .value.trim().toUpperCase();

    const type = document.getElementById("type").value;

    const discount = Number(
        document.getElementById("discount").value
    );

    const minimum = Number(
        document.getElementById("minimum").value
    );

    if (type === "percentage" && discount > 100) {

        alert("Percentage cannot exceed 100%.");

        return;
    }

    let coupons = getCoupons();

    if (coupons.some(coupon => coupon.code === code)) {

        alert("This Coupon Already Exists!");

        return;
    }

    const newCoupon = {

        id: Date.now(),

        code: code,

        type: type,

        discount: discount,

        minimum: minimum

    };

    coupons.push(newCoupon);

    localStorage.setItem(
        "coupons",
        JSON.stringify(coupons)
    );

    document.getElementById("message").innerText =
        "Coupon Created Successfully!";

    this.reset();

    loadCoupons();

});


// Delete Coupon

function deleteCoupon(index) {

    if (confirm("Are you sure you want to delete this coupon?")) {

        let coupons = getCoupons();

        coupons.splice(index, 1);

        localStorage.setItem(
            "coupons",
            JSON.stringify(coupons)
        );

        loadCoupons();

    }

}

loadCoupons();

</script>

</body>

</html>
